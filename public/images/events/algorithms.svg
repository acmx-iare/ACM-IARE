  <text x="50" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="800">Graph Theory &amp; Network Flows</text>
  <text x="50" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">Shortest paths, Dinic max-flow, 2-SAT and bridge-finding in C++</text>

  <!-- Graph Theory Diagram Graphic -->
  <g transform="translate(580, 160)">
    <circle cx="-50" cy="-40" r="14" fill="#3b82f6"/>
