<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0b1329"/>
  <!-- Auditorium seating tiered curve -->
  <path d="M 0 250 Q 300 200 600 250 L 600 400 L 0 400 Z" fill="#172554"/>
  <!-- Podium & Speaker -->
  <rect x="270" y="160" width="60" height="70" fill="#334155" rx="2"/>
  <circle cx="300" cy="140" r="14" fill="#93c5fd"/>
  <!-- Auditorium Stage Glow / Banner -->
  <rect x="150" y="40" width="300" height="70" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="300" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ACM DISTINGUISHED SPEAKER COLLOQUIUM</text>
  <text x="300" y="95" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Ethics, AI Governance &amp; Research Horizons</text>
  
  <text x="300" y="340" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Auditorium Keynote &amp; Interactive Q&amp;A</text>
  <text x="300" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Sarvepalli Radhakrishnan Hall • 250+ Attendees</text>
</svg>
