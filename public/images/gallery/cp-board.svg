<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Whiteboard representation with algorithmic math and graphs -->
  <rect x="60" y="40" width="480" height="250" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
  
  <text x="90" y="80" fill="#0f172a" font-family="monospace" font-size="14" font-weight="700">Dijkstra State: dist[v] = min(dist[v], dist[u] + w(u,v))</text>
  <text x="90" y="110" fill="#2563eb" font-family="monospace" font-size="13">Priority Queue: O((V + E) log V)</text>

  <!-- Graph on Board -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="0" y="5" fill="#0369a1" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">A</text>

    <circle cx="90" cy="-30" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="90" y="-25" fill="#0369a1" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">B</text>

    <circle cx="90" cy="40" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="90" y="45" fill="#0369a1" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">C</text>

    <circle cx="180" cy="10" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="180" y="15" fill="#15803d" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">D</text>

    <line x1="16" y1="-5" x2="74" y2="-25" stroke="#64748b" stroke-width="2"/>
    <text x="45" y="-25" fill="#475569" font-family="sans-serif" font-size="11">4</text>

    <line x1="16" y1="5" x2="74" y2="35" stroke="#64748b" stroke-width="2"/>
    <text x="45" y="30" fill="#475569" font-family="sans-serif" font-size="11">2</text>

    <line x1="106" y1="-25" x2="164" y2="5" stroke="#64748b" stroke-width="2"/>
    <text x="140" y="-20" fill="#475569" font-family="sans-serif" font-size="11">5</text>

    <line x1="106" y1="35" x2="164" y2="15" stroke="#64748b" stroke-width="2"/>
    <text x="140" y="35" fill="#475569" font-family="sans-serif" font-size="11">1</text>
  </g>

  <text x="300" y="340" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Competitive Programming Problem Debrief</text>
  <text x="300" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ICPC Regional Preparation • Algorithmic Proofs</text>
</svg>
