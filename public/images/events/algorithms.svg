    <line x1="-50" y1="-40" x2="0" y2="50" stroke="#93c5fd" stroke-width="2"/>
    <line x1="50" y1="-40" x2="0" y2="50" stroke="#93c5fd" stroke-width="2"/>
    <line x1="-50" y1="-40" x2="-80" y2="30" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="50" y1="-40" x2="80" y2="30" stroke="#93c5fd" stroke-width="1.5"/>

    <text x="-50" y="-35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">u</text>
    <text x="50" y="-35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">v</text>
    <text x="0" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">t</text>
