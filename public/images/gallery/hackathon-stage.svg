<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#0f172a"/>
  <!-- Stage presentation representation -->
  <rect x="0" y="260" width="600" height="140" fill="#1e293b"/>
  <!-- Presentation Screen -->
  <rect x="120" y="40" width="360" height="200" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <rect x="140" y="60" width="320" height="15" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="140" y="90" width="180" height="8" rx="2" fill="#93c5fd"/>
  <rect x="140" y="110" width="220" height="8" rx="2" fill="#93c5fd"/>
  <!-- Chart lines on screen -->
  <polyline points="150,180 200,160 250,170 300,130 350,140 400,110" fill="none" stroke="#22d3ee" stroke-width="3"/>
  <!-- Student Presenters Silhouette -->
  <circle cx="200" cy="245" r="14" fill="#64748b"/>
  <path d="M 180 280 Q 200 260 220 280 Z" fill="#64748b"/>
  <circle cx="240" cy="240" r="14" fill="#94a3b8"/>
  <path d="M 220 275 Q 240 255 260 275 Z" fill="#94a3b8"/>
  <text x="300" y="340" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Annual Hackathon Grand Finale Presentation</text>
  <text x="300" y="365" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">IARE Central Computing Centre • Jury Evaluation</text>
</svg>
