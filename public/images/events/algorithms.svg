<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad5)"/>
  
  <rect x="50" y="40" width="170" height="28" rx="4" fill="#1d4ed8" opacity="0.9"/>
  <text x="135" y="59" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ALGORITHMIC DRILL</text>

