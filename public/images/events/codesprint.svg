<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Header Bar -->
  <rect x="50" y="40" width="160" height="28" rx="4" fill="#0f766e" opacity="0.9"/>
  <text x="130" y="59" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ACM IARE HACKATHON</text>

  <text x="50" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">FLAGSHIP ANNUAL SPRINT</text>
  <text x="50" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">IARE CodeSprint 2026</text>
  <text x="50" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" max-width="500">12-Hour Algorithmic &amp; Campus Systems Prototyping Challenge</text>

  <!-- Technical Wireframe Diagram Graphic -->
  <g transform="translate(560, 180)">
    <rect x="-80" y="-80" width="160" height="160" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M -30 -20 L 0 -45 L 30 -20 L 20 30 L -20 30 Z" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="-45" r="5" fill="#38bdf8"/>
    <circle cx="30" cy="-20" r="5" fill="#38bdf8"/>
    <circle cx="20" cy="30" r="5" fill="#38bdf8"/>
    <circle cx="-20" cy="30" r="5" fill="#38bdf8"/>
    <circle cx="-30" cy="-20" r="5" fill="#38bdf8"/>
    <text x="0" y="5" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">&lt;CODE/&gt;</text>
  </g>

  <!-- Footer Specs -->
  <line x1="50" y1="360" x2="750" y2="360" stroke="#334155" stroke-width="1"/>
  <text x="50" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">DATE &amp; TIME</text>
  <text x="50" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">November 14, 2026 • 08:30 AM IST</text>

  <text x="320" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">VENUE</text>
  <text x="320" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Central Computing Centre, IARE Campus</text>

  <text x="620" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">ELIGIBILITY</text>
  <text x="620" y="420" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">All Engineering Branches</text>
</svg>
